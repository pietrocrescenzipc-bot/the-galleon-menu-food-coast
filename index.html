<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Galleon - Menu & Food Cost Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <button id="sidebarToggle" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2 shadow">
                <i class="fa-solid fa-boxes-stacked"></i> <span class="hidden sm:inline">Ingredienti Base & Prezzi</span><span class="sm:hidden">Ingredienti</span>
            </button>
            <div>
                <h1 class="text-lg sm:text-xl font-black tracking-wider text-amber-500 flex items-center gap-2">
                    <i class="fa-solid fa-anchor"></i> THE GALLEON
                </h1>
                <p class="text-xs text-gray-400 hidden sm:block">Gestione Menu & Food Cost in Tempo Reale</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="exportData()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-3 py-2 rounded-lg border border-gray-700 transition" title="Esporta JSON">
                <i class="fa-solid fa-download"></i> <span class="hidden md:inline">Esporta</span>
            </button>
            <button onclick="resetData()" class="bg-red-950/60 hover:bg-red-900 text-red-300 text-xs px-3 py-2 rounded-lg border border-red-800/50 transition" title="Ripristina originali">
                <i class="fa-solid fa-rotate-left"></i> <span class="hidden md:inline">Reset</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">

        <!-- SIDEBAR INGREDIENTI (DRAWER RESPONSIVE) -->
        <aside id="ingredientsSidebar" class="absolute inset-y-0 left-0 z-30 w-80 bg-gray-900 border-r border-gray-800 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col shadow-2xl">
            <div class="p-4 border-b border-gray-800 flex items-center justify-between bg-gray-950">
                <h2 class="font-bold text-amber-400 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-list-check"></i> Listino Ingredienti Base
                </h2>
                <button id="sidebarClose" class="lg:hidden text-gray-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-3 border-b border-gray-800 bg-gray-900/50">
                <input type="text" id="searchIngredient" placeholder="Cerca ingrediente..." class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-amber-500">
            </div>
            <div id="ingredientsListContainer" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3">
                <!-- Popolato via JS -->
            </div>
            <div class="p-3 border-t border-gray-800 bg-gray-950 text-xs text-gray-400 text-center">
                Modifica i prezzi al kg/pz per aggiornare istantaneamente il Food Cost.
            </div>
        </aside>

        <!-- OVERLAY MOBILE -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-20 hidden lg:hidden"></div>

        <!-- MAIN CONTENT: MENU COMPLETO -->
        <main class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 lg:p-8 bg-gray-950">
            <div class="max-w-7xl mx-auto space-y-8">

                <!-- BARRA DI RICERCA PRODOTTI E FILTRI -->
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 shadow flex flex-col sm:flex-row gap-4 items-center justify-between">
                    <div class="w-full sm:w-96 relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-500 text-xs"></i>
                        <input type="text" id="searchProduct" placeholder="Cerca piatto, ingrediente, prezzo..." class="w-full bg-gray-950 border border-gray-700 rounded-lg pl-9 pr-4 py-2 text-sm text-gray-200 focus:outline-none focus:border-amber-500">
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0" id="categoryFilters">
                        <button onclick="filterCategory('ALL')" class="cat-btn active bg-amber-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Tutti</button>
                        <button onclick="filterCategory('ANTIPASTI')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Antipasti</button>
                        <button onclick="filterCategory('TORTE')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Torte al Testo</button>
                        <button onclick="filterCategory('PALA')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Pala</button>
                        <button onclick="filterCategory('ROSSE')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Pizze Rosse</button>
                        <button onclick="filterCategory('BIANCHE')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Pizze Bianche</button>
                        <button onclick="filterCategory('HAMBURGER')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Hamburger</button>
                        <button onclick="filterCategory('TAGLIERI')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Taglieri</button>
                        <button onclick="filterCategory('PANINI')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Panini</button>
                        <button onclick="filterCategory('PIADINE')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Piadine</button>
                        <button onclick="filterCategory('HOTDOG')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Hot Dog</button>
                        <button onclick="filterCategory('FRIGGITORIA')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Friggitoria</button>
                        <button onclick="filterCategory('DOLCI')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Dolci</button>
                        <button onclick="filterCategory('BIBITE')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Bibite & Birre</button>
                        <button onclick="filterCategory('VINI')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Vini & Caffè</button>
                    </div>
                </div>

                <!-- LISTA PRODOTTI RENDERIZZATA DA JS -->
                <div id="menuContainer" class="space-y-10">
                    <!-- Popolato dinamicamente -->
                </div>

            </div>
        </main>
    </div>

    <!-- MODALE MODIFICA / GESTIONE RICETTA PRODOTTO -->
    <div id="productModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-gray-800 flex items-center justify-between bg-gray-950">
                <h3 id="modalProductName" class="font-bold text-amber-400 text-base">Modifica Piatto</h3>
                <button onclick="closeProductModal()" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 overflow-y-auto custom-scrollbar space-y-4 flex-1">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Prezzo di Vendita (€)</label>
                    <input type="number" step="0.5" id="modalProductPrice" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Ingredienti Utilizzati nella Ricetta (Quantità)</label>
                    <div id="modalIngredientsContainer" class="space-y-2 border border-gray-800 rounded-lg p-3 bg-gray-950">
                        <!-- Tabella ingredienti del piatto -->
                    </div>
                </div>
                <div class="pt-2">
                    <button onclick="addIngredientToProductModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-3 py-2 rounded-lg border border-gray-700 transition flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Aggiungi Ingrediente alla Ricetta
                    </button>
                </div>
            </div>
            <div class="p-4 border-t border-gray-800 bg-gray-950 flex justify-end gap-3">
                <button onclick="closeProductModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold px-4 py-2 rounded-lg transition">Annulla</button>
                <button onclick="saveProductModal()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition shadow">Salva Modifiche</button>
            </div>
        </div>
    </div>

            // DOLCI
            { id: "dolc_1", cat: "DOLCI", name: "TORTA CHEESECAKE", price: 5.5, badge: "", desc: "Frutti di bosco / Caramello / Nutella / Pistacchio.", recipe: {frutta_secca: 0.1} },

            { id: "dolc_3", cat: "DOLCI", name: "SEMIFREDDO AL CROCCANTE", price: 5.5, badge: "", desc: "Su letto di cioccolato fondente.", recipe: {frutta_secca: 0.1} },

            { id: "dolc_8", cat: "DOLCI", name: "TORTINO / SUFFLE' AL CIOCCOLATO", price: 5.5, badge: "", desc: "Con cuore caldo.", recipe: {frutta_secca: 0.12} },

            // BIBITE
            { id: "bib_1", cat: "BIBITE", name: "ACQUA 1/5 LT / 1 LT", price: 2.0, badge: "", desc: "Acqua minerale.", recipe: {formato_bibita: 1.0} },
            { id: "bib_2", cat: "BIBITE", name: "COCA COLA / FANTA / SPRITE / THE", price: 3.0, badge: "", desc: "Lattina 0,33 L.", recipe: {formato_bibita: 1.0} },
            { id: "bib_3", cat: "BIBITE", name: "BIRRA CARLSBERG (Spina 0.3l / 0.4l)", price: 4.0, badge: "SPINA", desc: "Lager, malto, bassa fermentazione.", recipe: {formato_bibita: 1.0} },
            { id: "bib_4", cat: "BIBITE", name: "BIRRA GRIMBERGEN DOUBLE (Spina)", price: 5.0, badge: "SPINA", desc: "Birra rossa alta fermentazione.", recipe: {formato_bibita: 1.0} },
            { id: "bib_5", cat: "BIBITE", name: "SPECIAL BREW / TUCHER WEIZEN", price: 5.0, badge: "SPINA", desc: "Doppio malto / Weizen.", recipe: {formato_bibita: 1.0} },
            { id: "bib_6", cat: "BIBITE", name: "BIRRE IN BOTTIGLIA (Radler, Gluten Free, Tennent's)", price: 4.5, badge: "BOTTIGLIA", desc: "Selezione bottiglie.", recipe: {formato_bibita: 1.0} },

            // VINI & CAFFÈ
            { id: "vin_1", cat: "VINI", name: "VINI IN BOTTIGLIA 0.375l / 0.75l (Antonutti)", price: 11.0, badge: "DOC", desc: "Refosco, Ribolla Gialla, Sauvignon, Traminer Aromatico.", recipe: {formato_bibita: 1.0} },
            { id: "vin_2", cat: "VINI", name: "AMARI E GRAPPA", price: 3.8, badge: "", desc: "Selezione di amari e grappe regionali.", recipe: {formato_bibita: 1.0} },
            { id: "vin_3", cat: "VINI", name: "CAFFÈ ESPRESSO", price: 1.5, badge: "", desc: "Caffè espresso italiano.", recipe: {formato_bibita: 1.0} }
        ];

        // --- 3. GESTIONE STATO E LOCALSTORAGE ---
        let ingredients = JSON.parse(localStorage.getItem('galleon_ingredients')) || defaultIngredients;
        let products = JSON.parse(localStorage.getItem('galleon_products')) || defaultProducts;
        let currentFilter = 'ALL';
        let currentEditingProductId = null;

        function saveData() {
            localStorage.setItem('galleon_ingredients', JSON.stringify(ingredients));
            localStorage.setItem('galleon_products', JSON.stringify(products));
        }

        function resetData() {
            if(confirm("Vuoi davvero ripristinare i dati originali di fabbrica?")) {
                localStorage.removeItem('galleon_ingredients');
                localStorage.removeItem('galleon_products');
                ingredients = JSON.parse(JSON.stringify(defaultIngredients));
                products = JSON.parse(JSON.stringify(defaultProducts));
                initApp();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ingredients, products}, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "the_galleon_menu_data.json");
            dlAnchorElem.click();
        }

        // --- 4. CALCOLO FOOD COST ---
        function calculateProductFoodCost(product) {
            let totalCost = 0;
            if (!product.recipe) return 0;
            for (let [ingKey, qty] of Object.entries(product.recipe)) {
                if (ingredients[ingKey]) {
                    totalCost += ingredients[ingKey].price * qty;
                }
            }
            return totalCost;
        }

        // --- 5. RENDER INTERFACCIA ---
        function initApp() {
            renderIngredientsList();
            renderMenu();
            setupEventListeners();
        }

        function renderIngredientsList() {
            const container = document.getElementById('ingredientsListContainer');
            const search = document.getElementById('searchIngredient').value.toLowerCase();
            container.innerHTML = '';

            for (let [key, ing] of Object.entries(ingredients)) {
                if (ing.name.toLowerCase().includes(search)) {
                    const div = document.createElement('div');
                    div.className = "bg-gray-950 p-2.5 rounded-lg border border-gray-800 flex items-center justify-between gap-2";
                    div.innerHTML = `
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-semibold text-gray-200 truncate" title="${ing.name}">${ing.name}</p>
                            <span class="text-[10px] text-gray-400">Prezzo / ${ing.unit}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-xs text-amber-500 font-bold">€</span>
                            <input type="number" step="0.1" value="${ing.price}" onchange="updateIngredientPrice('${key}', this.value)" class="w-16 bg-gray-900 border border-gray-700 rounded px-1.5 py-1 text-xs text-right text-white focus:outline-none focus:border-amber-500">
                        </div>
                    `;
                    container.appendChild(div);
                }
            }
        }

        function updateIngredientPrice(key, val) {
            const num = parseFloat(val);
            if (!isNaN(num) && num >= 0) {
                ingredients[key].price = num;
                saveData();
                renderMenu();
            }
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-amber-600', 'text-white');
                btn.classList.add('bg-gray-800', 'text-gray-300');
            });
            event.target.classList.remove('bg-gray-800', 'text-gray-300');
            event.target.classList.add('bg-amber-600', 'text-white');
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            const searchProd = document.getElementById('searchProduct').value.toLowerCase();
            container.innerHTML = '';

            // Raggruppa per categoria
            const categories = {};
            products.forEach(p => {
                if (currentFilter === 'ALL' || p.cat === currentFilter) {
                    if (p.name.toLowerCase().includes(searchProd) || p.desc.toLowerCase().includes(searchProd)) {
                        if (!categories[p.cat]) categories[p.cat] = [];
                        categories[p.cat].push(p);
                    }
                }
            });

            if (Object.keys(categories).length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-500 text-sm">Nessun piatto trovato con i criteri di ricerca.</div>`;
                return;
            }

            for (let [catName, prods] of Object.entries(categories)) {
                const section = document.createElement('div');
                section.className = "space-y-4";
                
                let catTitle = catName;
                if(catName === 'TORTE') catTitle = 'TORTE AL TESTO';
                if(catName === 'PALA') catTitle = 'PIZZA ALLA PALA';
                if(catName === 'ROSSE') catTitle = 'PIZZE ROSSE';
                if(catName === 'BIANCHE') catTitle = 'PIZZE BIANCHE';
                if(catName === 'HOTDOG') catTitle = 'HOT DOG';
                if(catName === 'VINI') catTitle = 'VINI, AMARI & CAFFÈ';

                section.innerHTML = `
                    <div class="border-b border-gray-800 pb-2 flex items-center justify-between">
                        <h2 class="text-base sm:text-lg font-black tracking-wide text-amber-400 flex items-center gap-2">
                            <i class="fa-solid fa-utensils text-xs"></i> ${catTitle}
                        </h2>
                        <span class="text-xs text-gray-500 font-medium">${prods.length} prodotti</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${prods.map(p => {
                            const foodCost = calculateProductFoodCost(p);
                            const margin = p.price > 0 ? ((p.price - foodCost) / p.price) * 100 : 0;
                            const marginColor = margin > 65 ? 'text-green-400' : (margin > 45 ? 'text-amber-400' : 'text-red-400');
                            
                            return `
                                <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col justify-between shadow hover:border-gray-700 transition">
                                    <div>
                                        <div class="flex items-start justify-between gap-2 mb-1">
                                            <h3 class="font-bold text-sm text-gray-100">${p.name}</h3>
                                            <span class="text-sm font-black text-amber-500 bg-amber-950/40 px-2 py-0.5 rounded border border-amber-800/40">€ ${p.price.toFixed(2)}</span>
                                        </div>
                                        ${p.badge ? `<span class="inline-block bg-gray-800 text-gray-300 text-[10px] font-semibold px-2 py-0.5 rounded mb-2 border border-gray-700">${p.badge}</span>` : ''}
                                        <p class="text-xs text-gray-400 mb-4 line-clamp-3">${p.desc}</p>
                                    </div>
                                    <div class="pt-3 border-t border-gray-800 flex items-center justify-between text-xs">
                                        <div class="space-y-0.5">
                                            <div class="text-gray-400">Food Cost: <span class="text-gray-200 font-semibold">€ ${foodCost.toFixed(2)}</span></div>
                                            <div class="text-gray-400">Margine: <span class="${marginColor} font-bold">${margin.toFixed(0)}%</span></div>
                                        </div>
                                        <button onclick="openProductModal('${p.id}')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white px-2.5 py-1.5 rounded-lg border border-gray-700 transition flex items-center gap-1.5">
                                            <i class="fa-solid fa-pen text-[10px]"></i> Modifica
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                container.appendChild(section);
            }
        }

        // --- 6. MODALE MODIFICA PRODOTTO & RICETTA ---
        function openProductModal(productId) {
            currentEditingProductId = productId;
            const product = products.find(p => p.id === productId);
            if (!product) return;

            document.getElementById('modalProductName').innerText = `Modifica Piatto: ${product.name}`;
            document.getElementById('modalProductPrice').value = product.price;

            renderModalIngredients(product);
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
            currentEditingProductId = null;
        }

        function renderModalIngredients(product) {
            const container = document.getElementById('modalIngredientsContainer');
            container.innerHTML = '';

            if (!product.recipe) product.recipe = {};

            for (let [ingKey, qty] of Object.entries(product.recipe)) {
                const ing = ingredients[ingKey];
                if (!ing) continue;

                const row = document.createElement('div');
                row.className = "flex items-center justify-between gap-2 bg-gray-900 p-2 rounded-lg border border-gray-800";
                row.innerHTML = `
                    <span class="text-xs text-gray-200 flex-1 truncate">${ing.name} (${ing.unit})</span>
                    <input type="number" step="0.01" value="${qty}" onchange="updateModalRecipeQty('${ingKey}', this.value)" class="w-20 bg-gray-950 border border-gray-700 rounded px-2 py-1 text-xs text-right text-white focus:outline-none focus:border-amber-500">
                    <button onclick="removeIngredientFromProduct('${ingKey}')" class="text-red-400 hover:text-red-300 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                `;
                container.appendChild(row);
            }
        }

        function updateModalRecipeQty(ingKey, val) {
            const product = products.find(p => p.id === currentEditingProductId);
            if (!product) return;
            const num = parseFloat(val);
            if (!isNaN(num) && num > 0) {
                product.recipe[ingKey] = num;
            } else {
                delete product.recipe[ingKey];
            }
        }

        function removeIngredientFromProduct(ingKey) {
            const product = products.find(p => p.id === currentEditingProductId);
            if (!product) return;
            delete product.recipe[ingKey];
            renderModalIngredients(product);
        }

        function addIngredientToProductModal() {
            const product = products.find(p => p.id === currentEditingProductId);
            if (!product) return;

            // Seleziona primo ingrediente disponibile non ancora inserito
            const availableKeys = Object.keys(ingredients).filter(k => !product.recipe[k]);
            if (availableKeys.length === 0) {
                alert("Tutti gli ingredienti sono già presenti nella ricetta!");
                return;
            }
            product.recipe[availableKeys[0]] = 0.1;
            renderModalIngredients(product);
        }

        function saveProductModal() {
            const product = products.find(p => p.id === currentEditingProductId);
            if (!product) return;

            const newPrice = parseFloat(document.getElementById('modalProductPrice').value);
            if (!isNaN(newPrice) && newPrice >= 0) {
                product.price = newPrice;
            }

            saveData();
            closeProductModal();
            renderMenu();
        }

        // --- 7. EVENT LISTENERS E RESPONSIVE SIDEBAR ---
        function setupEventListeners() {
            const sidebar = document.getElementById('ingredientsSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const toggleBtn = document.getElementById('sidebarToggle');
            const closeBtn = document.getElementById('sidebarClose');

            function toggleSidebar() {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            }

            toggleBtn.addEventListener('click', toggleSidebar);
            closeBtn.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);

            document.getElementById('searchIngredient').addEventListener('input', renderIngredientsList);
            document.getElementById('searchProduct').addEventListener('input', renderMenu);
        }

        // Avvio app all'caricamento
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
